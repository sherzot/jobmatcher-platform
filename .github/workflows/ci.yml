name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: jobmatcher_db
          MYSQL_USER: jobmatcher
          MYSQL_PASSWORD: jobmatcher123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DATABASE_URL: mysql://jobmatcher:jobmatcher123@127.0.0.1:3306/jobmatcher_db
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
      FRONTEND_URL: http://localhost:3010
      NEXT_PUBLIC_API_URL: http://localhost:3011/api
      PORT: 3011
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Dependency audit (report-only)
        run: npm audit --audit-level=high > npm-audit-report.txt 2>&1 || true
      - run: npx prisma generate --schema=./prisma/schema.prisma
      - run: npx prisma migrate deploy --schema=./prisma/schema.prisma
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Build API production entrypoint for web E2E
        run: npm run build -w apps/api
      - run: npm run test:e2e:ci -w apps/web
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-e2e-diagnostics
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            npm-audit-report.txt
          if-no-files-found: ignore

  fastify-e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: jobmatcher_db
          MYSQL_USER: jobmatcher
          MYSQL_PASSWORD: jobmatcher123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://jobmatcher:jobmatcher123@127.0.0.1:3306/jobmatcher_db
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
      FRONTEND_URL: http://localhost:3010
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=./prisma/schema.prisma
      - run: npx prisma migrate deploy --schema=./prisma/schema.prisma
      - run: npm run db:seed
      - name: Fastify full AppModule E2E
        run: npm run test:e2e:fastify -w apps/api
